# Application Configuration
spring.application.name=portfolio-backend
spring.profiles.active=dev
server.port=${PORT:8080}

# MySQL Database Configuration via Environment Variables (Strictly parameterized)
spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JPA / Hibernate Configuration (Schema managed and validated against Flyway)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# JWT Configuration via Environment Variables
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Google OAuth2 Client Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
app.oauth2.authorized-redirect-uri=${OAUTH2_REDIRECT_URI:http://localhost:4200/oauth2/redirect}

# Twelve Data Market Data Configuration
twelvedata.api.key=${TWELVE_DATA_API_KEY:demo}
twelvedata.api.base-url=${TWELVE_DATA_BASE_URL:https://api.twelvedata.com}
twelvedata.api.timeout-ms=${TWELVE_DATA_TIMEOUT_MS:25000}

# Upstox API Configuration (Indian Market Data)
upstox.api.client-id=${UPSTOX_CLIENT_ID:}
upstox.api.client-secret=${UPSTOX_CLIENT_SECRET:}
upstox.api.redirect-uri=${UPSTOX_REDIRECT_URI:http://localhost:8080/api/upstox/callback}
upstox.api.base-url=${UPSTOX_BASE_URL:https://api.upstox.com/v2}
upstox.api.auth-url=${UPSTOX_AUTH_URL:https://api.upstox.com/v2/login/authorization/dialog}
upstox.api.timeout-ms=${UPSTOX_TIMEOUT_MS:25000}
upstox.api.access-token=${UPSTOX_ACCESS_TOKEN:}
# Tomcat relaxed query characters for instrument keys like NSE_EQ|INE002A01018
server.tomcat.relaxed-query-chars=|,:,{,},[,]
server.tomcat.relaxed-path-chars=|,:,{,},[,]
